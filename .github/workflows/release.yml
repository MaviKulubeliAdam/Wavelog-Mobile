name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # flutter-version: '3.44.1'
    # (kept as a marker line for the fdroiddata recipe's version-extraction
    # sed; the clone step below reads the same pin manually)
    env:
      # Must match the `repo=` path F-Droid's build recipe moves to — the
      # Dart AOT snapshot (libapp.so) embeds the absolute build path, so a
      # mismatch here breaks reproducible-build verification.
      REPO_DIR: /build/com.wavelog_mobile
    steps:
      - uses: actions/checkout@v4

      - name: Move checkout to fixed build path
        run: |
          sudo mkdir -p /build
          sudo chown -R "$USER" /build
          shopt -s dotglob
          mkdir -p "$REPO_DIR"
          mv "$GITHUB_WORKSPACE"/* "$REPO_DIR"/

      - name: Clone Flutter SDK matching F-Droid's srclib method
        # F-Droid's prebuild step greps this same file for the marker
        # comment above (search job.build for the literal word "marker")
        # and does the equivalent of a checkout to that pinned version.
        # Reading it here the same way keeps a single source of truth.
        # subosito/flutter-action produced a byte-different libdartjni.so
        # (a prebuilt engine artifact, not something we compile), so we
        # replicate F-Droid's own clone method exactly instead of using it.
        run: |
          flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/release.yml)
          [[ -n "$flutterVersion" ]]
          git clone --branch "$flutterVersion" --depth 1 https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        working-directory: /build/com.wavelog_mobile
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/wavelog-release.jks

      - name: Write key.properties
        working-directory: /build/com.wavelog_mobile
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=wavelog
          storeFile=wavelog-release.jks
          EOF

      - name: flutter pub get
        working-directory: /build/com.wavelog_mobile
        run: flutter pub get --enforce-lockfile

      - name: Build per-ABI release APKs
        working-directory: /build/com.wavelog_mobile
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            /build/com.wavelog_mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            /build/com.wavelog_mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            /build/com.wavelog_mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
