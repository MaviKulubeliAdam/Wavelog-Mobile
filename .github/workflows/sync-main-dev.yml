name: Sync main-dev with main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into main-dev
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout main-dev
          git merge origin/main --ff-only || git merge origin/main -m "chore: sync main-dev with main"
          git push origin main-dev
